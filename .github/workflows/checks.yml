name: Source and security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked development packages without install scripts
        run: npm ci --ignore-scripts
      - name: Check JavaScript dependency advisories
        run: npm audit --audit-level=moderate
      - name: Install optional photo-import dependency and auditor
        run: python -m pip install -r runtime/requirements-import.txt pip-audit==2.10.1
      - name: Check optional Python dependency advisories
        run: pip-audit -r runtime/requirements-import.txt -r runtime/requirements-background.txt
      - name: Run synthetic tests without a browser
        run: npm test
      - name: Check public source boundaries
        run: python tools/check_public_source.py
      - name: Scan source history for secrets with verified Gitleaks
        shell: bash
        run: |
          curl --fail --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
