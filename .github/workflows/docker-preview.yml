name: Publish Docker preview
on: create
permissions:
  contents: read
concurrency:
  group: docker-preview-publication
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'stephthegeek/closetlint' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'codex/docker-preview-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.preview.outputs.version }}
      revision: ${{ steps.preview.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require numbered preview branch and successful checks
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          branch = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'codex/docker-preview-(0\.5\.0)\.([1-9][0-9]*)', branch)
          if not match:
              raise SystemExit('Choose a numbered Docker preview branch for released 0.5.0.')
          version = match[1] + '-docker-preview.' + match[2]
          compose = pathlib.Path('compose.preview.yaml').read_text()
          assert 'image: ghcr.io/stephthegeek/closetlint:' + version + '\n' in compose, 'Compose must name this exact preview.'
          revision = subprocess.check_output(['git', 'rev-parse', '--verify', 'v0.5.0^{commit}'], text=True).strip()
          assert revision == '67cb7b75109b9b37368cd0dc8a25bec0b6d2d92a', 'Released app revision changed.'
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', os.environ['GITHUB_SHA'], 'origin/codex/docker-0.5.0'])
          runs = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&per_page=100']))
          for name in ('Source and security checks', 'Docker checks'):
              assert any(r['name'] == name and r['head_sha'] == os.environ['GITHUB_SHA'] and r['conclusion'] == 'success' for r in runs['workflow_runs']), name + ' must pass on this exact preview commit before publishing.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\nrevision=' + revision + '\n')
          PY
  images:
    needs: preview
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare released app with preview packaging
        run: python3 deploy/docker/release_context.py --ref v0.5.0 --out "$RUNNER_TEMP/docker-preview"
      - name: Build and test before upload
        env:
          APP_REVISION: ${{ needs.preview.outputs.revision }}
          PREVIEW_VERSION: ${{ needs.preview.outputs.version }}
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$APP_REVISION" --label "org.opencontainers.image.version=$PREVIEW_VERSION" --label "io.closetlint.packaging=$GITHUB_SHA" --tag closetlint:preview "$RUNNER_TEMP/docker-preview"
          python3 "$RUNNER_TEMP/docker-preview/deploy/docker/smoke.py" --image closetlint:preview --models
          docker compose -f compose.preview.yaml config --quiet
      - name: Upload tested architecture for this run
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.architecture }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY:preview-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag closetlint:preview "$image"
          docker push "$image"
  publish:
    needs: [preview, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish numbered preview only after both architectures pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preview.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY"
          if docker manifest inspect "$image:$VERSION" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
            echo 'This preview already exists. Choose a new preview number.' >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|no such manifest' "$RUNNER_TEMP/manifest-error"; then
            cat "$RUNNER_TEMP/manifest-error" >&2
            exit 1
          fi
          docker manifest create "$image:$VERSION" "$image:preview-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" "$image:preview-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          docker manifest push "$image:$VERSION"
          {
            echo 'Docker preview published: `'
            echo "$image:$VERSION"
            echo '`'
            echo 'Verify public package visibility and an anonymous pull before sharing the installation instructions.'
          } >> "$GITHUB_STEP_SUMMARY"
