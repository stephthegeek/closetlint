name: Publish released Docker image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable published release, such as v0.5.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: docker-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'stephthegeek/closetlint' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Use a stable version tag.')
          release = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/releases/tags/' + tag]))
          assert release['tag_name'] == tag and not release['draft'] and not release['prerelease'] and release['published_at']
          revision = subprocess.check_output(['git', 'rev-parse', '--verify', tag + '^{commit}'], text=True).strip()
          runs = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs?head_sha=' + revision + '&per_page=100']))
          assert any(r['name'] == 'Source and security checks' and r['head_sha'] == revision and r['conclusion'] == 'success' for r in runs['workflow_runs']), 'The released commit needs successful source/security checks.'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\nversion=' + tag[1:] + '\nrevision=' + revision + '\n')
          PY
  images:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare exact released app with reviewed packaging
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: python3 deploy/docker/release_context.py --ref "$RELEASE_TAG" --out "$RUNNER_TEMP/docker-release"
      - name: Build and test before any upload
        env:
          APP_REVISION: ${{ needs.release.outputs.revision }}
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$APP_REVISION" --label "org.opencontainers.image.version=$APP_VERSION" --label "io.closetlint.packaging=$GITHUB_SHA" --tag closetlint:release "$RUNNER_TEMP/docker-release"
          python3 "$RUNNER_TEMP/docker-release/deploy/docker/smoke.py" --image closetlint:release --models
      - name: Upload tested architecture for this run
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.architecture }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag closetlint:release "$image"
          docker push "$image"
  publish:
    needs: [release, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish version only after both architectures pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/$GITHUB_REPOSITORY"
          # Preserve an existing version; do not silently replace published images.
          if docker manifest inspect "$image:$VERSION" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
            echo 'This image version already exists. Review an explicit rebuild version instead.' >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|no such manifest' "$RUNNER_TEMP/manifest-error"; then
            cat "$RUNNER_TEMP/manifest-error" >&2
            exit 1
          fi
          docker manifest create "$image:$VERSION" "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" "$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          docker manifest push "$image:$VERSION"
