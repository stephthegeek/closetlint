name: Publish approved 0.5.0 release
on:
  workflow_run:
    workflows: [Source and security checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release Closet Lint 0.5.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-closet-lint-0.5.0
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify approved release source
        shell: bash
        run: |
          test "$(git log -1 --format=%s)" = 'Release Closet Lint 0.5.0'
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$RELEASE_SHA"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          assert json.loads(Path('package.json').read_text())['version']=='0.5.0'
          assert hashlib.sha256(Path('app/closet-lint.html').read_bytes()).hexdigest()=='995e48823a63a30ba4e80a470485955cef543328c3117087c00c403ea16fa87c'
          notes=Path('docs/RELEASE-NOTES.md').read_text()
          assert notes.startswith('# Closet Lint 0.5.0 · 8 November 2026\n')
          readme=Path('README.md').read_text()
          assert '**Latest release: [Closet Lint 0.5.0]' in readme
          assert 'being prepared for 0.5' not in readme
          PY
      - name: Build and verify publication archives
        shell: bash
        run: |
          mkdir dist
          python tools/check_public_source.py
          python tools/build_release.py --version 0.5.0 --out dist/closet-lint-0.5.0.zip
          python deploy/siteground/build_package.py --out dist/closet-lint-0.5.0-siteground.zip
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          for path in Path('dist').glob('*.zip'):
              prefix='' if 'siteground' in path.name else 'closet-lint-0.5.0/'
              manifest='HOSTED-SOURCE-MANIFEST.json' if not prefix else 'SOURCE-MANIFEST.json'
              with zipfile.ZipFile(path) as archive:
                  files=json.loads(archive.read(prefix+manifest))
                  assert set(archive.namelist())=={prefix+n for n in files}|{prefix+manifest}
                  assert all(hashlib.sha256(archive.read(prefix+n)).hexdigest()==h for n,h in files.items())
                  assert not any('AUDIT-CANDIDATE' in n or n.endswith(('.sqlite3','.pem','.key')) for n in files)
          notes=Path('docs/RELEASE-NOTES.md').read_text().split('\n# Closet Lint 0.4.0',1)[0]
          notes=notes.split('\n',1)[1].strip()+'\n'
          notes=notes.replace('(USING-CLOSET-LINT.md)','(https://github.com/stephthegeek/closetlint/blob/v0.5.0/docs/USING-CLOSET-LINT.md)')
          Path('dist/release-notes.md').write_text(notes)
          PY
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Publish approved release with verified assets
        shell: bash
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            echo 'Release v0.5.0 already exists; refusing to replace it.'
            exit 1
          fi
          gh release create v0.5.0 --target "$RELEASE_SHA" --title 'Closet Lint 0.5.0' --notes-file dist/release-notes.md --draft dist/closet-lint-0.5.0.zip dist/closet-lint-0.5.0-siteground.zip dist/SHA256SUMS.txt
          gh release view v0.5.0 --json assets --jq '.assets[].name' | sort > dist/uploaded-assets.txt
          printf '%s\n' SHA256SUMS.txt closet-lint-0.5.0-siteground.zip closet-lint-0.5.0.zip | sort > dist/expected-assets.txt
          diff -u dist/expected-assets.txt dist/uploaded-assets.txt
          gh release edit v0.5.0 --draft=false --latest
